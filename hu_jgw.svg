  <circle cx="40" cy="92" r="8" fill="#4FB3E8" stroke="#3A3A3A" stroke-width="3"/>
  <circle cx="48" cy="132" r="7" fill="#4FB3E8" stroke="#3A3A3A" stroke-width="3"/>
  <!-- 古：十+口 -->
  <line x1="96" y1="34" x2="148" y2="34" stroke="#3A3A3A" stroke-width="11" stroke-linecap="round"/>
  <line x1="122" y1="34" x2="122" y2="62" stroke="#3A3A3A" stroke-width="11" stroke-linecap="round"/>
  <rect x="100" y="62" width="44" height="34" rx="4" fill="#FFF6E3" stroke="#3A3A3A" stroke-width="5"/>
  <!-- 月：弯月形 -->
  <path d="M100 110 Q92 110 92 120 L92 170 Q92 180 102 180 L140 180 Q150 180 150 170 L150 120 Q150 110 142 110" fill="none" stroke="#3A3A3A" stroke-width="6" stroke-linejoin="round"/>
