<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- 沐·第一幕·实物：小水滴坐在木盆里洗头发，头上好多泡泡 -->
  <!-- 木盆 -->
  <path d="M 30 130 Q 30 170 100 176 Q 170 170 170 130 Z" fill="#C49A5A" stroke="#3A3A3A" stroke-width="4" stroke-linejoin="round"/>
  <path d="M 30 130 Q 100 120 170 130" fill="none" stroke="#3A3A3A" stroke-width="4"/>
  <!-- 盆里的水 -->
  <ellipse cx="100" cy="132" rx="62" ry="10" fill="#4FA3D8" stroke="#3A3A3A" stroke-width="2.5"/>
  <!-- 小水滴角色（墨墨风格：蓝色圆头+笑脸） -->
  <path d="M100 56 Q74 56 72 86 Q72 112 100 118 Q128 112 128 86 Q126 56 100 56 Z" fill="#4FB3E8" stroke="#3A3A3A" stroke-width="3.5"/>
  <!-- 眼睛 -->
  <circle cx="88" cy="82" r="5" fill="#2A3B4C"/>
  <circle cx="112" cy="82" r="5" fill="#2A3B4C"/>
  <circle cx="86" cy="80" r="2" fill="#FFFFFF"/>
  <circle cx="110" cy="80" r="2" fill="#FFFFFF"/>
  <!-- 笑嘴 -->
  <path d="M90 96 Q100 104 110 96" fill="none" stroke="#3A3A3A" stroke-width="2.5" stroke-linecap="round"/>
  <!-- 头发（湿漉漉，贴在头上） -->
  <path d="M76 66 Q72 50 84 44 Q100 38 116 44 Q128 50 124 66" fill="none" stroke="#3A3A3A" stroke-width="3.5" stroke-linecap="round"/>
  <!-- 泡泡（头上好多） -->
  <g stroke="#3A3A3A" stroke-width="2">
    <circle cx="70" cy="46" r="10" fill="#C4E8FA"/>
    <circle cx="92" cy="34" r="12" fill="#C4E8FA"/>
    <circle cx="116" cy="36" r="10" fill="#C4E8FA"/>
    <circle cx="134" cy="50" r="8" fill="#C4E8FA"/>
    <circle cx="82" cy="54" r="6" fill="#C4E8FA"/>
    <circle cx="124" cy="56" r="6" fill="#C4E8FA"/>
  </g>
  <!-- 泡泡高光 -->
  <circle cx="68" cy="43" r="3" fill="#FFFFFF" opacity="0.8"/>
  <circle cx="88" cy="30" r="3.5" fill="#FFFFFF" opacity="0.8"/>
  <!-- 水滴从手上滴下 -->
  <path d="M72 118 Q70 128 74 136" fill="#7EC4EA" stroke="#3A3A3A" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M128 118 Q130 128 126 136" fill="#7EC4EA" stroke="#3A3A3A" stroke-width="2.5" stroke-linecap="round"/>
</svg>
