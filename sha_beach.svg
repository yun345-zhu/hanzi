<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- 第一幕·实物：水退下去了，沙滩露出来，一粒一粒的沙 -->
  <!-- 上半：退走的水（蓝色波浪层，正在变窄） -->
  <path d="M 0 0 L 200 0 L 200 54 Q 175 66 150 54 Q 125 42 100 56 Q 75 70 50 54 Q 25 40 0 56 Z" fill="#4FA3D8" stroke="#3A3A3A" stroke-width="3.5" stroke-linejoin="round"/>
  <path d="M 24 26 q 12 7 24 0 M 88 20 q 12 7 24 0 M 150 28 q 12 7 24 0" fill="none" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" opacity="0.85"/>
  <!-- 水正在退的箭头感：斜的水边线 -->
  <!-- 下半：沙滩 -->
  <path d="M 0 54 Q 25 40 50 54 Q 75 70 100 56 Q 125 42 150 54 Q 175 66 200 54 L 200 200 L 0 200 Z" fill="#F5D98A" stroke="#3A3A3A" stroke-width="3.5" stroke-linejoin="round"/>
  <!-- 沙粒（一粒一粒） -->
  <g fill="#E8A73E" stroke="#3A3A3A" stroke-width="2">
    <circle cx="42" cy="96" r="6"/>
    <circle cx="86" cy="112" r="7"/>
    <circle cx="132" cy="92" r="6"/>
    <circle cx="62" cy="148" r="7"/>
    <circle cx="118" cy="160" r="6"/>
    <circle cx="162" cy="132" r="7"/>
    <circle cx="34" cy="182" r="6"/>
    <circle cx="96" cy="190" r="6"/>
    <circle cx="154" cy="186" r="7"/>
  </g>
  <!-- 一个小贝壳点缀 -->
  <path d="M 74 172 q 10 -14 20 0 q -10 8 -20 0 Z" fill="#FFF3D9" stroke="#3A3A3A" stroke-width="2.5"/>
</svg>
