  <line x1="114" y1="100" x2="164" y2="100" stroke="#3A3A3A" stroke-width="4" stroke-linecap="round"/>
  <line x1="114" y1="136" x2="164" y2="136" stroke="#3A3A3A" stroke-width="4" stroke-linecap="round"/>
  <!-- 高光 -->
