<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- 部件·目：眼睛收拢成"目"（介于眼睛与字之间） -->
  <!-- 外框：竖着的杏仁/矩形，像眯起来的眼睛 -->
  <rect x="58" y="40" width="84" height="120" rx="42" fill="#FFFFFF" stroke="#3A3A3A" stroke-width="5"/>
  <!-- 中间瞳孔变成一横 -->
  <line x1="72" y1="100" x2="128" y2="100" stroke="#E8913A" stroke-width="8" stroke-linecap="round"/>
  <!-- 上下横线：眯眼的两道缝，正是"目"的横画 -->
  <line x1="72" y1="72" x2="128" y2="72" stroke="#3A3A3A" stroke-width="6" stroke-linecap="round"/>
  <line x1="72" y1="128" x2="128" y2="128" stroke="#3A3A3A" stroke-width="6" stroke-linecap="round"/>
  <!-- 侧边小高光，保留"眼睛"的记忆 -->
  <circle cx="86" cy="62" r="5" fill="#7EC4EA"/>
</svg>
