<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- 部件·每：人形+发饰（像一个人头上插着簪子） -->
  <!-- 上横（发饰） -->
  <path d="M40 34 Q70 28 100 34" fill="none" stroke="#3A3A3A" stroke-width="10" stroke-linecap="round"/>
  <path d="M40 34 Q70 28 100 34" fill="none" stroke="#E8913A" stroke-width="5" stroke-linecap="round"/>
  <!-- 竖（人形中轴） -->
  <path d="M70 34 Q68 56 72 80" fill="none" stroke="#3A3A3A" stroke-width="10" stroke-linecap="round"/>
  <path d="M70 34 Q68 56 72 80" fill="none" stroke="#E8913A" stroke-width="5" stroke-linecap="round"/>
  <!-- 中横（手臂/腰带） -->
  <path d="M44 68 Q70 62 96 68" fill="none" stroke="#3A3A3A" stroke-width="9" stroke-linecap="round"/>
  <path d="M44 68 Q70 62 96 68" fill="none" stroke="#E8913A" stroke-width="4" stroke-linecap="round"/>
  <!-- 两点（胸前装饰，像母字的两点） -->
  <circle cx="54" cy="84" r="6" fill="#4FB3E8" stroke="#3A3A3A" stroke-width="3"/>
  <circle cx="86" cy="84" r="6" fill="#4FB3E8" stroke="#3A3A3A" stroke-width="3"/>
  <!-- 下横 -->
  <path d="M48 100 Q70 94 92 100" fill="none" stroke="#3A3A3A" stroke-width="9" stroke-linecap="round"/>
  <path d="M48 100 Q70 94 92 100" fill="none" stroke="#E8913A" stroke-width="4" stroke-linecap="round"/>
  <!-- 两条腿 -->
  <path d="M60 100 Q58 140 64 170" fill="none" stroke="#3A3A3A" stroke-width="9" stroke-linecap="round"/>
  <path d="M80 100 Q82 140 76 170" fill="none" stroke="#3A3A3A" stroke-width="9" stroke-linecap="round"/>
  <!-- 高光 -->
  <circle cx="62" cy="30" r="3.5" fill="#FFFFFF" opacity="0.7"/>
</svg>
