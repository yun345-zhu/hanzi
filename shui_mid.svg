<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- 第二幕·过渡帧：河收拢了——只剩一条弯弯的主线，旁边溅着水花（介于画与字之间） -->
  <!-- 主线：河流收拢成一条弯线 -->
  <path d="M 100 16 Q 74 60 100 96 T 112 186" fill="none" stroke="#4FA3D8" stroke-width="16" stroke-linecap="round"/>
  <path d="M 100 16 Q 74 60 100 96 T 112 186" fill="none" stroke="#3A3A3A" stroke-width="20" stroke-linecap="round" opacity="0.12"/>
  <!-- 左侧水花两滴 -->
  <g stroke="#3A3A3A" stroke-width="3">
    <circle cx="62" cy="72" r="11" fill="#7EC4EA"/>
    <circle cx="58" cy="128" r="9" fill="#7EC4EA"/>
  </g>
  <!-- 右侧水花两滴 -->
  <g stroke="#3A3A3A" stroke-width="3">
    <circle cx="142" cy="56" r="9" fill="#7EC4EA"/>
    <circle cx="146" cy="118" r="11" fill="#7EC4EA"/>
  </g>
  <!-- 虚线提示：河的轮廓还在 -->
  <path d="M 96 14 Q 66 62 98 100 T 118 188" fill="none" stroke="#8CC66A" stroke-width="3" stroke-dasharray="7,7" opacity="0.6"/>
</svg>
