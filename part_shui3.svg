<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- 部件·氵：水滴变成三点水 -->
  <!-- 第一滴（左上） -->
  <path d="M 60 42 Q 76 68 60 82 Q 44 68 60 42 Z" fill="#4FA3D8" stroke="#3A3A3A" stroke-width="4"/>
  <!-- 第二滴（左中） -->
  <path d="M 52 104 Q 70 132 52 148 Q 34 132 52 104 Z" fill="#4FA3D8" stroke="#3A3A3A" stroke-width="4"/>
  <!-- 第三滴提笔（右下，长长的，像水滴正在跳） -->
  <path d="M 96 150 Q 118 120 138 96 Q 128 130 112 154 Q 100 162 96 150 Z" fill="#7EC4EA" stroke="#3A3A3A" stroke-width="4"/>
  <!-- 小高光 -->
  <circle cx="55" cy="62" r="4" fill="#FFFFFF"/>
  <circle cx="48" cy="124" r="3.5" fill="#FFFFFF"/>
</svg>
