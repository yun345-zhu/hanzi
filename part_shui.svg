<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- 部件·水：殿主本尊（中竖钩=河，两侧=水花），泉字下半 -->
  <!-- 中竖钩：那条河 -->
  <path d="M100 34 Q99 95 100 148 Q100 160 86 152" fill="none" stroke="#3A3A3A" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M100 34 Q99 95 100 148 Q100 160 86 152" fill="none" stroke="#E8913A" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- 左横撇：左边的水花 -->
  <path d="M58 92 L88 74 Q76 110 62 128" fill="none" stroke="#3A3A3A" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M58 92 L88 74 Q76 110 62 128" fill="none" stroke="#E8913A" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- 左下撇：溅远的水花 -->
  <path d="M56 102 Q68 134 54 164" fill="none" stroke="#3A3A3A" stroke-width="12" stroke-linecap="round"/>
  <path d="M56 102 Q68 134 54 164" fill="none" stroke="#E8913A" stroke-width="6" stroke-linecap="round"/>
  <!-- 右横：右边的水花 -->
  <path d="M104 74 L142 90" fill="none" stroke="#3A3A3A" stroke-width="12" stroke-linecap="round"/>
  <path d="M104 74 L142 90" fill="none" stroke="#E8913A" stroke-width="6" stroke-linecap="round"/>
  <!-- 右下捺：溅远的水花 -->
  <path d="M146 100 Q140 134 156 162" fill="none" stroke="#3A3A3A" stroke-width="12" stroke-linecap="round"/>
  <path d="M146 100 Q140 134 156 162" fill="none" stroke="#E8913A" stroke-width="6" stroke-linecap="round"/>
  <!-- 高光 -->
  <circle cx="92" cy="40" r="4" fill="#FFFFFF" opacity="0.7"/>
</svg>
