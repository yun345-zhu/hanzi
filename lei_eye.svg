<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- 第一幕·实物：一只眼睛，跑出来一滴眼泪 -->
  <!-- 眼白与轮廓（弯弯的杏仁形） -->
  <path d="M 28 100 Q 100 46 172 100 Q 100 154 28 100 Z" fill="#FFFFFF" stroke="#3A3A3A" stroke-width="4" stroke-linejoin="round"/>
  <!-- 瞳孔（水蓝色，眼里住着水） -->
  <circle cx="100" cy="100" r="26" fill="#4FA3D8" stroke="#3A3A3A" stroke-width="3.5"/>
  <circle cx="100" cy="100" r="11" fill="#2A3B4C"/>
  <!-- 高光 -->
  <circle cx="90" cy="90" r="5" fill="#FFFFFF"/>
  <!-- 眼睛上方的笑纹/睫毛 -->
  <path d="M 60 74 q 8 -10 18 -12 M 132 62 q 10 2 18 10" fill="none" stroke="#3A3A3A" stroke-width="3.5" stroke-linecap="round"/>
  <!-- 泪滴：正从右眼角滑落 -->
  <path d="M 168 116 Q 180 138 168 150 Q 156 138 168 116 Z" fill="#7EC4EA" stroke="#3A3A3A" stroke-width="3"/>
  <circle cx="164" cy="132" r="3" fill="#FFFFFF" opacity="0.9"/>
  <!-- 泪滴滑落的轨迹 -->
  <path d="M 166 108 q 4 8 2 14" fill="none" stroke="#7EC4EA" stroke-width="3" stroke-dasharray="2,6" stroke-linecap="round"/>
</svg>
