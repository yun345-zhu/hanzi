<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- 湖·第一幕·实物：安安静静的湖，中间有小岛 -->
  <!-- 远岸 -->
  <path d="M 0 30 Q 50 20 100 28 T 200 26 L 200 50 Q 150 40 100 48 T 0 46 Z" fill="#8CC66A" stroke="#3A3A3A" stroke-width="3" stroke-linejoin="round"/>
  <!-- 湖面（大椭圆，平静） -->
  <ellipse cx="100" cy="110" rx="98" ry="58" fill="#4FA3D8" stroke="#3A3A3A" stroke-width="3.5"/>
  <!-- 小岛 -->
  <ellipse cx="100" cy="72" rx="28" ry="14" fill="#8CC66A" stroke="#3A3A3A" stroke-width="3"/>
  <line x1="100" y1="58" x2="100" y2="40" stroke="#3A3A3A" stroke-width="2.5"/>
  <circle cx="100" cy="36" r="10" fill="#6FAE4A" stroke="#3A3A3A" stroke-width="2.5"/>
  <!-- 水面波纹（安静，波纹少且小） -->
  <path d="M 30 100 q 10 4 20 0 M 140 96 q 10 4 20 0 M 60 140 q 10 4 20 0 M 120 142 q 10 4 20 0" fill="none" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round" opacity="0.7"/>
  <!-- 倒影 -->
  <ellipse cx="100" cy="84" rx="18" ry="6" fill="#6FAE4A" opacity="0.25"/>
</svg>
